services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
      - ./rclone_config:/root/.config/rclone:ro
    environment:
      - DB_PATH=/data/budget.db
      # primary | standby | mirror (mirror = dati dall'app sul telefono, web in sola lettura)
      - NODE_ROLE=${NODE_ROLE:-primary}
      # token per POST /api/backup-upload dall'app (in .env sul Pi, mai nel repo)
      - BACKUP_TOKEN=${BACKUP_TOKEN:-}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
